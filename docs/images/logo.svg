<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 180" width="100%" height="180" fill="none">
  <defs>
    <!-- Gradients matching style.css -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="coolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#2e1065" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filters for Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas Card (Optional Subtle Dark/Transparent) -->
  <rect x="5" y="5" width="810" height="170" rx="24" fill="url(#cardBg)" stroke="url(#primaryGrad)" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Subtle grid pattern inside card -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="30" y1="45" x2="790" y2="45" />
    <line x1="30" y1="90" x2="790" y2="90" />
    <line x1="30" y1="135" x2="790" y2="135" />
    <line x1="200" y1="20" x2="200" y2="160" />
    <line x1="400" y1="20" x2="400" y2="160" />
    <line x1="600" y1="20" x2="600" y2="160" />
  </g>

  <!-- ICON BADGE (Left) -->
  <g transform="translate(35, 25)" filter="url(#iconShadow)">
    <!-- Base Icon Container with Glass Border -->
    <rect x="0" y="0" width="130" height="130" rx="26" fill="#13112c" stroke="url(#primaryGrad)" stroke-width="2.5" />
    <rect x="0" y="0" width="130" height="130" rx="26" fill="url(#primaryGrad)" opacity="0.12" />

    <!-- Analytics Bars -->
    <rect x="24" y="76" width="14" height="34" rx="4" fill="url(#barGrad1)" />
    <rect x="44" y="56" width="14" height="54" rx="4" fill="url(#coolGrad)" />
    <rect x="64" y="40" width="14" height="70" rx="4" fill="url(#barGrad2)" />
    <rect x="84" y="26" width="14" height="84" rx="4" fill="url(#primaryGrad)" />

    <!-- Trend Curve Line with Glow -->
    <path d="M 28 72 Q 48 50, 70 38 T 94 20" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
    <path d="M 28 72 Q 48 50, 70 38 T 94 20" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

    <!-- Sparkle / Star (Automated Cleaning Symbol) -->
    <g transform="translate(98, 16)">
      <circle cx="0" cy="0" r="4.5" fill="#ec4899" filter="url(#glow)" />
      <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
    </g>
  </g>

  <!-- TEXT TYPOGRAPHY (Right) -->
  <g transform="translate(195, 30)">
    <!-- Tagline pill / badge -->
    <g transform="translate(0, 10)">
      <rect x="0" y="0" width="180" height="24" rx="12" fill="url(#coolGrad)" opacity="0.2" />
      <rect x="0" y="0" width="180" height="24" rx="12" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.4" />
      <text x="90" y="16" fill="#38bdf8" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">PYTHON &amp; FLASK EDA</text>
    </g>

    <!-- Project Title -->
    <text x="0" y="68" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="800" font-size="36" letter-spacing="-0.5" fill="url(#primaryGrad)">
      SALES ANALYTICS
    </text>

    <!-- Subtitle / Capability Stack -->
    <text x="0" y="98" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-weight="500" font-size="15" fill="#cbd5e1" letter-spacing="0.5">
      Automated Data Cleaning <tspan fill="#ec4899">•</tspan> Exploratory Data Analysis <tspan fill="#06b6d4">•</tspan> Interactive Plotly Visualizations
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 114)">
      <text x="0" y="0" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif" font-size="12" font-weight="600" fill="#94a3b8">
        <tspan fill="#34d399">✓</tspan> CSV &amp; Excel Uploads   <tspan fill="#34d399">✓</tspan> Real-time Filtering   <tspan fill="#34d399">✓</tspan> Gunicorn &amp; Render Ready
      </text>
    </g>
  </g>
</svg>
