<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="coolGradFav" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pinkGradFav" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#0f172a" stroke="url(#favGrad)" stroke-width="2" filter="url(#favGlow)" />

  <!-- Background Glow -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favGrad)" opacity="0.15" />

  <!-- Rising Bars -->
  <rect x="12" y="36" width="7" height="16" rx="2" fill="url(#coolGradFav)" />
  <rect x="22" y="27" width="7" height="25" rx="2" fill="#06b6d4" />
  <rect x="32" y="19" width="7" height="33" rx="2" fill="url(#favGrad)" />
  <rect x="42" y="12" width="7" height="40" rx="2" fill="url(#pinkGradFav)" />

  <!-- Trend Curve -->
  <path d="M 14 34 Q 24 22, 35 16 T 47 9" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Apex Sparkle Dot -->
  <circle cx="47" cy="9" r="2.5" fill="#38bdf8" />
</svg>
