<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

   <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Analytics | Upload Dataset</title>

   

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="upload-container">

    <div class="upload-card">

        <h1>Sales Analytics Dashboard</h1>

        <p class="subtitle">
            Upload your sales dataset and transform raw data into meaningful insights.
        </p>

        <div class="upload-icon">
            📊
        </div>

        <h2>Upload Sales Dataset</h2>

        <p class="upload-info">
            Supported formats: CSV and Excel (.xlsx)
        </p>

        <form action="/upload"
              method="POST"
              enctype="multipart/form-data"
              class="upload-form">

            <label for="file" class="file-label">
                Choose Dataset
            </label>

            <input type="file"
                   id="file"
                   name="file"
                   accept=".csv,.xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv"
                   required
                   onchange="showFileName()">

            <p id="file-name" class="file-name">
                No file selected
            </p>

            <button type="submit">
                Upload & Analyze
            </button>

        </form>

        <div class="features">

            <div class="feature">
                <strong>🧹 Clean</strong>
                <span>Automatically clean your data</span>
            </div>

            <div class="feature">
                <strong>📈 Analyze</strong>
                <span>Perform sales analysis</span>
            </div>

            <div class="feature">
                <strong>📊 Visualize</strong>
                <span>Explore interactive charts</span>
            </div>

        </div>

    </div>

</div>

<script>
function showFileName() {

    const input = document.getElementById("file");
    const fileName = document.getElementById("file-name");

    if (input.files.length > 0) {
        fileName.textContent = "Selected: " + input.files[0].name;
    } else {
        fileName.textContent = "No file selected";
    }
}
</script>

</body>
</html>
