<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="cbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="55%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cbCoolGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cbPinkGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="cbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Circular container (matches the floating button shape) -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#cbGrad)" stroke-width="2" filter="url(#cbGlow)" />
  <circle cx="32" cy="32" r="30" fill="url(#cbGrad)" opacity="0.15" />

  <!-- Rising bars -->
  <rect x="14" y="42" width="7" height="14" rx="2" fill="url(#cbCoolGrad)" />
  <rect x="24" y="34" width="7" height="22" rx="2" fill="#06b6d4" />
  <rect x="34" y="26" width="7" height="30" rx="2" fill="url(#cbGrad)" />
  <rect x="44" y="18" width="7" height="38" rx="2" fill="url(#cbPinkGrad)" />

  <!-- Trend curve -->
  <path d="M 16 40 Q 26 28, 37 22 T 49 14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />

  <!-- Apex sparkle dot -->
  <circle cx="49" cy="14" r="2.5" fill="#38bdf8" />
</svg>
