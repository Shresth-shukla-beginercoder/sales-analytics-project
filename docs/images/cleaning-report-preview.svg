<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="100%" height="580" fill="none">
  <defs>
    <linearGradient id="crBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>

    <linearGradient id="crBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="crGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="crShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Shell -->
  <g filter="url(#crShadow)">
    <rect x="20" y="20" width="920" height="540" rx="16" fill="url(#crBgGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Bar -->
    <path d="M 20 36 Q 20 20 36 20 L 924 20 Q 940 20 940 36 L 940 64 L 20 64 Z" fill="#0b0f19" />
    <line x1="20" y1="64" x2="940" y2="64" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="48" cy="42" r="6" fill="#ef4444" />
    <circle cx="68" cy="42" r="6" fill="#f59e0b" />
    <circle cx="88" cy="42" r="6" fill="#10b981" />

    <rect x="120" y="30" width="600" height="24" rx="12" fill="#1e293b" />
    <text x="140" y="46" fill="#94a3b8" class="font-mono" font-size="11">https://sales-analytics-project-2fjs.onrender.com/result</text>

    <!-- CONTENT -->
    <g transform="translate(60, 95)">
      <!-- Title & Status Pill -->
      <g>
        <rect x="0" y="0" width="160" height="26" rx="13" fill="#10b981" fill-opacity="0.18" stroke="#10b981" stroke-width="1" />
        <text x="80" y="17" fill="#34d399" class="font-sub" font-size="11" text-anchor="middle">✓ PIPELINE SUCCESS</text>

        <text x="0" y="58" fill="url(#crBrandGrad)" class="font-title" font-size="28">Automated Data Cleaning Report</text>
        <text x="0" y="82" fill="#94a3b8" class="font-body" font-size="14">Your raw dataset was analyzed, harmonized, and sanitized in 0.42 seconds.</text>
      </g>

      <!-- 6 METRIC TILES (2 rows x 3 columns) -->
      <g transform="translate(0, 110)">
        <!-- Tile 1: Original Rows -->
        <rect x="0" y="0" width="250" height="90" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#475569" stroke-width="1" />
        <text x="20" y="28" fill="#94a3b8" class="font-sub" font-size="12">ORIGINAL ROWS</text>
        <text x="20" y="65" fill="#f8fafc" class="font-title" font-size="30">17</text>
        <text x="210" y="60" font-size="22">📄</text>

        <!-- Tile 2: Cleaned Rows -->
        <rect x="275" y="0" width="250" height="90" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#10b981" stroke-width="1.2" />
        <text x="295" y="28" fill="#34d399" class="font-sub" font-size="12">CLEANED ROWS</text>
        <text x="295" y="65" fill="#34d399" class="font-title" font-size="30">14</text>
        <text x="485" y="60" font-size="22">✨</text>

        <!-- Tile 3: Duplicate Records -->
        <rect x="550" y="0" width="250" height="90" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#ec4899" stroke-width="1.2" />
        <text x="570" y="28" fill="#f472b6" class="font-sub" font-size="12">DUPLICATES REMOVED</text>
        <text x="570" y="65" fill="#ec4899" class="font-title" font-size="30">2</text>
        <text x="760" y="60" font-size="22">🗑️</text>

        <!-- Tile 4: Rows Filtered/Dropped -->
        <rect x="0" y="110" width="250" height="90" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#f59e0b" stroke-width="1.2" />
        <text x="20" y="138" fill="#fbbf24" class="font-sub" font-size="12">ANOMALIES DROPPED</text>
        <text x="20" y="175" fill="#f59e0b" class="font-title" font-size="30">3</text>
        <text x="110" y="172" fill="#94a3b8" class="font-body" font-size="11">(Invalid Qty / Nulls)</text>

        <!-- Tile 5: Missing Values Before -->
        <rect x="275" y="110" width="250" height="90" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#ef4444" stroke-width="1.2" />
        <text x="295" y="138" fill="#f87171" class="font-sub" font-size="12">NULLS BEFORE</text>
        <text x="295" y="175" fill="#ef4444" class="font-title" font-size="30">6</text>
        <text x="360" y="172" fill="#94a3b8" class="font-body" font-size="11">Missing fields</text>

        <!-- Tile 6: Missing Values After -->
        <rect x="550" y="110" width="250" height="90" rx="12" fill="#1e293b" fill-opacity="0.7" stroke="#06b6d4" stroke-width="1.2" />
        <text x="570" y="138" fill="#38bdf8" class="font-sub" font-size="12">NULLS AFTER CLEANING</text>
        <text x="570" y="175" fill="#06b6d4" class="font-title" font-size="30">0</text>
        <text x="635" y="172" fill="#34d399" class="font-sub" font-size="11">✓ Fully Imputed</text>
      </g>

      <!-- Action Buttons Row -->
      <g transform="translate(0, 335)">
        <!-- View Dashboard CTA Button -->
        <rect x="0" y="0" width="280" height="46" rx="10" fill="url(#crBrandGrad)" />
        <text x="140" y="28" fill="#ffffff" class="font-sub" font-size="14" text-anchor="middle">View Interactive Dashboard ➔</text>

        <!-- Download CSV Button -->
        <rect x="300" y="0" width="160" height="46" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="380" y="28" fill="#38bdf8" class="font-sub" font-size="13" text-anchor="middle">📥 Download CSV</text>

        <!-- Download Excel Button -->
        <rect x="480" y="0" width="160" height="46" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
        <text x="560" y="28" fill="#10b981" class="font-sub" font-size="13" text-anchor="middle">📊 Download Excel</text>
      </g>
    </g>
  </g>
</svg>
