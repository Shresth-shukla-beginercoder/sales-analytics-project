<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="820" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="dbWindowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="dbGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="dbGradCool" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="dbGradGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="dbCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="barGradA" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="barGradB" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="dbGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="windowShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Outer Canvas with Drop Shadow -->
  <g filter="url(#windowShadow)">
    <!-- Browser Window Shell -->
    <rect x="20" y="20" width="1160" height="780" rx="16" fill="url(#dbWindowGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Titlebar -->
    <path d="M 20 36 Q 20 20 36 20 L 1164 20 Q 1180 20 1180 36 L 1180 68 L 20 68 Z" fill="#0f172a" />
    <line x1="20" y1="68" x2="1180" y2="68" stroke="#1e293b" stroke-width="1.5" />

    <!-- Window Dots -->
    <circle cx="48" cy="44" r="6" fill="#ef4444" />
    <circle cx="68" cy="44" r="6" fill="#f59e0b" />
    <circle cx="88" cy="44" r="6" fill="#10b981" />

    <!-- Browser Address Bar -->
    <rect x="120" y="32" width="760" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <!-- Lock Icon -->
    <g transform="translate(136, 38)" fill="#10b981">
      <path d="M7 3a2 2 0 00-2 2v2a1 1 0 00-1 1v4a1 1 0 001 1h6a1 1 0 001-1V8a1 1 0 00-1-1V5a2 2 0 00-2-2zm-1 4V5a1 1 0 112 0v2H6z"/>
    </g>
    <text x="156" y="49" fill="#94a3b8" class="font-mono" font-size="11">https://sales-analytics-project-2fjs.onrender.com/dashboard</text>

    <!-- Window Action Badge -->
    <rect x="1040" y="34" width="115" height="22" rx="11" fill="url(#dbGradGreen)" />
    <text x="1097" y="49" fill="#ffffff" class="font-sub" font-size="10" text-anchor="middle">LIVE PREVIEW</text>

    <!-- DASHBOARD CONTENT WRAPPER -->
    <g transform="translate(45, 85)">
      <!-- Top Header & Breadcrumb -->
      <text x="0" y="24" fill="url(#dbGradPrimary)" class="font-title" font-size="24" letter-spacing="-0.5">Sales Analytics Executive Dashboard</text>
      <text x="0" y="42" fill="#94a3b8" class="font-body" font-size="12">Real-time Exploratory Data Analysis &amp; Performance Metrics</text>

      <!-- Active Filters Pill Bar -->
      <g transform="translate(0, 56)">
        <rect x="0" y="0" width="1110" height="42" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="16" y="26" fill="#94a3b8" class="font-sub" font-size="12">Filters:</text>

        <!-- City Dropdown Mockup -->
        <rect x="70" y="8" width="130" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="82" y="25" fill="#f8fafc" class="font-body" font-size="11">City: All Cities ▼</text>

        <!-- Category Dropdown Mockup -->
        <rect x="212" y="8" width="165" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="224" y="25" fill="#f8fafc" class="font-body" font-size="11">Category: All Categories ▼</text>

        <!-- Product Dropdown Mockup -->
        <rect x="389" y="8" width="155" height="26" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
        <text x="401" y="25" fill="#f8fafc" class="font-body" font-size="11">Product: All Products ▼</text>

        <!-- Apply Button -->
        <rect x="945" y="8" width="80" height="26" rx="6" fill="url(#dbGradCool)" />
        <text x="985" y="25" fill="#ffffff" class="font-sub" font-size="11" text-anchor="middle">Apply</text>

        <!-- Reset Button -->
        <rect x="1035" y="8" width="65" height="26" rx="6" fill="#334155" />
        <text x="1067" y="25" fill="#cbd5e1" class="font-sub" font-size="11" text-anchor="middle">Reset</text>
      </g>

      <!-- 5 KPI SUMMARY CARDS -->
      <g transform="translate(0, 112)">
        <!-- Card 1: Total Sales -->
        <rect x="0" y="0" width="210" height="78" rx="12" fill="url(#dbCardBg)" stroke="#6366f1" stroke-width="1.2" />
        <text x="16" y="24" fill="#a5b4fc" class="font-sub" font-size="11" letter-spacing="0.5">TOTAL SALES</text>
        <text x="16" y="52" fill="#ffffff" class="font-title" font-size="22">₹2,45,200</text>
        <rect x="145" y="14" width="52" height="18" rx="9" fill="#10b981" fill-opacity="0.2" />
        <text x="171" y="27" fill="#34d399" class="font-sub" font-size="10" text-anchor="middle">+14.2%</text>

        <!-- Card 2: Average Sales -->
        <rect x="225" y="0" width="210" height="78" rx="12" fill="url(#dbCardBg)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="241" y="24" fill="#7dd3fc" class="font-sub" font-size="11" letter-spacing="0.5">AVERAGE SALES</text>
        <text x="241" y="52" fill="#ffffff" class="font-title" font-size="22">₹15,325</text>
        <text x="241" y="68" fill="#94a3b8" class="font-body" font-size="10">Per Transaction</text>

        <!-- Card 3: Total Quantity -->
        <rect x="450" y="0" width="210" height="78" rx="12" fill="url(#dbCardBg)" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="466" y="24" fill="#c4b5fd" class="font-sub" font-size="11" letter-spacing="0.5">TOTAL QUANTITY</text>
        <text x="466" y="52" fill="#ffffff" class="font-title" font-size="22">54 units</text>
        <text x="466" y="68" fill="#94a3b8" class="font-body" font-size="10">Across 14 Orders</text>

        <!-- Card 4: Best Product -->
        <rect x="675" y="0" width="210" height="78" rx="12" fill="url(#dbCardBg)" stroke="#ec4899" stroke-width="1.2" />
        <text x="691" y="24" fill="#f472b6" class="font-sub" font-size="11" letter-spacing="0.5">BEST PRODUCT</text>
        <text x="691" y="52" fill="#ffffff" class="font-title" font-size="21">Laptop</text>
        <text x="691" y="68" fill="#fb7185" class="font-body" font-size="10">₹1,55,000 (63% Rev)</text>

        <!-- Card 5: Top City -->
        <rect x="900" y="0" width="210" height="78" rx="12" fill="url(#dbCardBg)" stroke="#10b981" stroke-width="1.2" />
        <text x="916" y="24" fill="#6ee7b7" class="font-sub" font-size="11" letter-spacing="0.5">TOP CITY</text>
        <text x="916" y="52" fill="#ffffff" class="font-title" font-size="21">Delhi</text>
        <text x="916" y="68" fill="#34d399" class="font-body" font-size="10">₹1,73,500 Sales</text>
      </g>

      <!-- CHARTS ROW: Bar Chart (Left) + Donut Chart (Right) -->
      <g transform="translate(0, 204)">
        <!-- Box 1: Product-wise Sales Bar Chart -->
        <rect x="0" y="0" width="620" height="235" rx="12" fill="url(#dbCardBg)" stroke="#334155" stroke-width="1" />
        <text x="20" y="28" fill="#ffffff" class="font-sub" font-size="14">Product-wise Sales Revenue</text>
        <text x="20" y="44" fill="#64748b" class="font-body" font-size="11">Interactive Plotly.js Bar Visualization</text>

        <!-- Chart Grid Lines -->
        <g stroke="#334155" stroke-width="0.8" stroke-dasharray="3 3">
          <line x1="80" y1="65" x2="590" y2="65" />
          <line x1="80" y1="105" x2="590" y2="105" />
          <line x1="80" y1="145" x2="590" y2="145" />
          <line x1="80" y1="185" x2="590" y2="185" />
        </g>
        <!-- Y-Axis Labels -->
        <text x="70" y="69" fill="#64748b" class="font-mono" font-size="9" text-anchor="end">160k</text>
        <text x="70" y="109" fill="#64748b" class="font-mono" font-size="9" text-anchor="end">100k</text>
        <text x="70" y="149" fill="#64748b" class="font-mono" font-size="9" text-anchor="end">50k</text>
        <text x="70" y="189" fill="#64748b" class="font-mono" font-size="9" text-anchor="end">0</text>

        <!-- Gradient Bars -->
        <!-- Laptop: 155k -->
        <rect x="100" y="68" width="55" height="117" rx="5" fill="url(#barGradA)" />
        <text x="127" y="60" fill="#38bdf8" class="font-sub" font-size="10" text-anchor="middle">₹155k</text>
        <text x="127" y="202" fill="#94a3b8" class="font-body" font-size="10" text-anchor="middle">Laptop</text>

        <!-- Monitor: 45k -->
        <rect x="180" y="151" width="55" height="34" rx="5" fill="url(#barGradB)" />
        <text x="207" y="144" fill="#ec4899" class="font-sub" font-size="10" text-anchor="middle">₹45k</text>
        <text x="207" y="202" fill="#94a3b8" class="font-body" font-size="10" text-anchor="middle">Monitor</text>

        <!-- Desk: 33.5k -->
        <rect x="260" y="160" width="55" height="25" rx="5" fill="url(#barGradA)" />
        <text x="287" y="153" fill="#38bdf8" class="font-sub" font-size="10" text-anchor="middle">₹33.5k</text>
        <text x="287" y="202" fill="#94a3b8" class="font-body" font-size="10" text-anchor="middle">Desk</text>

        <!-- Chair: 22k -->
        <rect x="340" y="168" width="55" height="17" rx="5" fill="url(#barGradB)" />
        <text x="367" y="161" fill="#ec4899" class="font-sub" font-size="10" text-anchor="middle">₹22k</text>
        <text x="367" y="202" fill="#94a3b8" class="font-body" font-size="10" text-anchor="middle">Chair</text>

        <!-- Keyboard: 6.2k -->
        <rect x="420" y="180" width="55" height="5" rx="2" fill="url(#barGradA)" />
        <text x="447" y="174" fill="#38bdf8" class="font-sub" font-size="10" text-anchor="middle">₹6.2k</text>
        <text x="447" y="202" fill="#94a3b8" class="font-body" font-size="10" text-anchor="middle">Keyboard</text>

        <!-- Mouse: 7k -->
        <rect x="500" y="179" width="55" height="6" rx="2" fill="url(#barGradB)" />
        <text x="527" y="173" fill="#ec4899" class="font-sub" font-size="10" text-anchor="middle">₹7k</text>
        <text x="527" y="202" fill="#94a3b8" class="font-body" font-size="10" text-anchor="middle">Mouse</text>

        <!-- Box 2: Category-wise Donut Chart -->
        <rect x="640" y="0" width="470" height="235" rx="12" fill="url(#dbCardBg)" stroke="#334155" stroke-width="1" />
        <text x="660" y="28" fill="#ffffff" class="font-sub" font-size="14">Category Contribution</text>
        <text x="660" y="44" fill="#64748b" class="font-body" font-size="11">Revenue Share by Product Category</text>

        <!-- SVG Donut Chart -->
        <g transform="translate(770, 130)">
          <!-- Electronics Arc: 78% of 2*PI*55 = 345 circumference -> stroke-dasharray="270 345" -->
          <circle cx="0" cy="0" r="55" fill="none" stroke="#6366f1" stroke-width="26" stroke-dasharray="270 345" stroke-dashoffset="0" transform="rotate(-90)" />
          <!-- Furniture Arc: 22% -> stroke-dasharray="75 345" -->
          <circle cx="0" cy="0" r="55" fill="none" stroke="#ec4899" stroke-width="26" stroke-dasharray="75 345" stroke-dashoffset="-270" transform="rotate(-90)" />
          <!-- Inner Hole Text -->
          <text x="0" y="-3" fill="#ffffff" class="font-title" font-size="18" text-anchor="middle">₹2.45L</text>
          <text x="0" y="14" fill="#94a3b8" class="font-body" font-size="10" text-anchor="middle">TOTAL</text>
        </g>

        <!-- Donut Legend -->
        <g transform="translate(890, 85)">
          <rect x="0" y="0" width="14" height="14" rx="4" fill="#6366f1" />
          <text x="22" y="12" fill="#ffffff" class="font-sub" font-size="12">Electronics</text>
          <text x="22" y="28" fill="#94a3b8" class="font-mono" font-size="11">₹2,13,200 (87%)</text>

          <rect x="0" y="48" width="14" height="14" rx="4" fill="#ec4899" />
          <text x="22" y="60" fill="#ffffff" class="font-sub" font-size="12">Furniture</text>
          <text x="22" y="76" fill="#94a3b8" class="font-mono" font-size="11">₹32,000 (13%)</text>

          <rect x="0" y="94" width="170" height="24" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
          <text x="85" y="110" fill="#34d399" class="font-sub" font-size="10" text-anchor="middle">✓ Highest Margin: Electronics</text>
        </g>
      </g>

      <!-- ROW 3: Monthly Trend Line Chart (Full Width) -->
      <g transform="translate(0, 452)">
        <rect x="0" y="0" width="1110" height="125" rx="12" fill="url(#dbCardBg)" stroke="#334155" stroke-width="1" />
        <text x="20" y="24" fill="#ffffff" class="font-sub" font-size="13">Monthly Sales Trend (Q1 - Q2 Velocity)</text>

        <!-- Trend Line Chart with Path & Glow -->
        <g stroke="#334155" stroke-width="0.7" stroke-dasharray="3 3">
          <line x1="80" y1="42" x2="1070" y2="42" />
          <line x1="80" y1="72" x2="1070" y2="72" />
          <line x1="80" y1="102" x2="1070" y2="102" />
        </g>

        <!-- Monthly Line Path -->
        <path d="M 120 95 L 340 70 L 580 40 L 820 62 L 1020 35" fill="none" stroke="url(#dbGradPrimary)" stroke-width="3.5" filter="url(#dbGlow)" />
        <path d="M 120 95 L 340 70 L 580 40 L 820 62 L 1020 35" fill="none" stroke="#ffffff" stroke-width="2" />

        <!-- Area fill under line -->
        <path d="M 120 95 L 340 70 L 580 40 L 820 62 L 1020 35 L 1020 102 L 120 102 Z" fill="url(#dbGradPrimary)" fill-opacity="0.12" />

        <!-- Data Points & Labels -->
        <g>
          <circle cx="120" cy="95" r="5" fill="#6366f1" stroke="#ffffff" stroke-width="2" />
          <text x="120" y="116" fill="#94a3b8" class="font-sub" font-size="10" text-anchor="middle">2026-01 (₹35k)</text>

          <circle cx="340" cy="70" r="5" fill="#8b5cf6" stroke="#ffffff" stroke-width="2" />
          <text x="340" y="116" fill="#94a3b8" class="font-sub" font-size="10" text-anchor="middle">2026-02 (₹58k)</text>

          <circle cx="580" cy="40" r="5" fill="#ec4899" stroke="#ffffff" stroke-width="2" />
          <text x="580" y="116" fill="#94a3b8" class="font-sub" font-size="10" text-anchor="middle">2026-03 (₹89k)</text>

          <circle cx="820" cy="62" r="5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" />
          <text x="820" y="116" fill="#94a3b8" class="font-sub" font-size="10" text-anchor="middle">2026-04 (₹62k)</text>

          <circle cx="1020" cy="35" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" />
          <text x="1020" y="116" fill="#34d399" class="font-sub" font-size="10" text-anchor="middle">Peak Projected</text>
        </g>
      </g>

      <!-- ROW 4: Cleaned Data Preview Table Snippet -->
      <g transform="translate(0, 590)">
        <rect x="0" y="0" width="1110" height="98" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />

        <!-- Table Header -->
        <rect x="1" y="1" width="1108" height="28" rx="9" fill="#1e293b" />
        <text x="20" y="19" fill="#94a3b8" class="font-sub" font-size="10">ORDER_ID</text>
        <text x="140" y="19" fill="#94a3b8" class="font-sub" font-size="10">ORDER_DATE</text>
        <text x="270" y="19" fill="#94a3b8" class="font-sub" font-size="10">PRODUCT</text>
        <text x="420" y="19" fill="#94a3b8" class="font-sub" font-size="10">CATEGORY</text>
        <text x="560" y="19" fill="#94a3b8" class="font-sub" font-size="10">QUANTITY</text>
        <text x="690" y="19" fill="#94a3b8" class="font-sub" font-size="10">PRICE</text>
        <text x="820" y="19" fill="#94a3b8" class="font-sub" font-size="10">CITY</text>
        <text x="960" y="19" fill="#94a3b8" class="font-sub" font-size="10">TOTAL SALES</text>

        <!-- Sample Clean Row 1 -->
        <text x="20" y="47" fill="#f8fafc" class="font-mono" font-size="10">1001</text>
        <text x="140" y="47" fill="#cbd5e1" class="font-body" font-size="10">2026-01-05</text>
        <text x="270" y="47" fill="#38bdf8" class="font-sub" font-size="10">Laptop</text>
        <text x="420" y="47" fill="#c4b5fd" class="font-body" font-size="10">Electronics</text>
        <text x="560" y="47" fill="#f8fafc" class="font-body" font-size="10">2</text>
        <text x="690" y="47" fill="#f8fafc" class="font-body" font-size="10">₹50,000</text>
        <text x="820" y="47" fill="#34d399" class="font-body" font-size="10">Delhi</text>
        <text x="960" y="47" fill="#10b981" class="font-sub" font-size="10">₹1,00,000</text>

        <line x1="10" y1="58" x2="1100" y2="58" stroke="#1e293b" stroke-width="1" />

        <!-- Sample Clean Row 2 -->
        <text x="20" y="78" fill="#f8fafc" class="font-mono" font-size="10">1006</text>
        <text x="140" y="78" fill="#cbd5e1" class="font-body" font-size="10">2026-02-15</text>
        <text x="270" y="78" fill="#38bdf8" class="font-sub" font-size="10">Monitor</text>
        <text x="420" y="78" fill="#c4b5fd" class="font-body" font-size="10">Electronics</text>
        <text x="560" y="78" fill="#f8fafc" class="font-body" font-size="10">3</text>
        <text x="690" y="78" fill="#f8fafc" class="font-body" font-size="10">₹15,000</text>
        <text x="820" y="78" fill="#34d399" class="font-body" font-size="10">Lucknow</text>
        <text x="960" y="78" fill="#10b981" class="font-sub" font-size="10">₹45,000</text>
      </g>
    </g>
  </g>
</svg>
