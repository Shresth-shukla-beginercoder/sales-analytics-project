<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="100%" height="620" fill="none">
  <defs>
    <!-- Background Gradient matching style.css aurora -->
    <linearGradient id="upBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="upBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="upCoolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="upShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="upGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; }
    .font-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; }
    .font-body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
  </style>

  <!-- Browser Shell -->
  <g filter="url(#upShadow)">
    <rect x="20" y="20" width="920" height="580" rx="16" fill="url(#upBgGrad)" stroke="#334155" stroke-width="1.5" />

    <!-- Window Header -->
    <path d="M 20 36 Q 20 20 36 20 L 924 20 Q 940 20 940 36 L 940 64 L 20 64 Z" fill="#0b0f19" />
    <line x1="20" y1="64" x2="940" y2="64" stroke="#1e293b" stroke-width="1.5" />

    <!-- Window Buttons -->
    <circle cx="48" cy="42" r="6" fill="#ef4444" />
    <circle cx="68" cy="42" r="6" fill="#f59e0b" />
    <circle cx="88" cy="42" r="6" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="120" y="30" width="600" height="24" rx="12" fill="#1e293b" />
    <text x="140" y="46" fill="#94a3b8" class="font-mono" font-size="11">https://sales-analytics-project-2fjs.onrender.com</text>

    <!-- Glowing Background Aura Orbs -->
    <circle cx="280" cy="220" r="140" fill="#6366f1" opacity="0.15" filter="url(#upGlow)" />
    <circle cx="700" cy="400" r="130" fill="#ec4899" opacity="0.12" filter="url(#upGlow)" />

    <!-- UPLOAD CARD (Centered Glassmorphism) -->
    <g transform="translate(190, 95)">
      <!-- Card Container -->
      <rect x="0" y="0" width="540" height="465" rx="20" fill="#13192b" fill-opacity="0.85" stroke="url(#upBrandGrad)" stroke-width="1.8" />

      <!-- Top Title -->
      <text x="270" y="44" fill="url(#upBrandGrad)" class="font-title" font-size="24" text-anchor="middle">Sales Analytics Dashboard</text>
      <text x="270" y="68" fill="#94a3b8" class="font-body" font-size="13" text-anchor="middle">Upload your sales dataset &amp; transform raw data into insights</text>

      <!-- Animated Pulse Icon -->
      <g transform="translate(270, 115)">
        <circle cx="0" cy="0" r="32" fill="#6366f1" opacity="0.25" filter="url(#upGlow)" />
        <circle cx="0" cy="0" r="24" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" />
        <text x="0" y="8" font-size="22" text-anchor="middle">📊</text>
      </g>

      <!-- Drop Zone Area -->
      <g transform="translate(45, 165)">
        <!-- Dashed Upload Box -->
        <rect x="0" y="0" width="450" height="195" rx="14" fill="#0b0f19" fill-opacity="0.6" stroke="#6366f1" stroke-width="2" stroke-dasharray="8 6" />

        <!-- Cloud Upload Icon Graphic -->
        <g transform="translate(225, 48)" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M-22 10 A16 16 0 0 1 -4 -6 A24 24 0 0 1 20 -4 A18 18 0 0 1 22 14 L-18 14 A12 12 0 0 1 -22 10 Z" />
          <path d="M0 6 L0 -2 M-4 1 L0 -3 L4 1" stroke="#ffffff" stroke-width="2" />
        </g>

        <!-- Drop text -->
        <text x="225" y="92" fill="#ffffff" class="font-sub" font-size="16" text-anchor="middle">Drag &amp; Drop sales dataset here</text>
        <text x="225" y="112" fill="#64748b" class="font-body" font-size="12" text-anchor="middle">or browse files from your computer</text>

        <!-- File Select Button -->
        <g transform="translate(150, 132)">
          <rect x="0" y="0" width="150" height="38" rx="19" fill="url(#upBrandGrad)" />
          <text x="75" y="24" fill="#ffffff" class="font-sub" font-size="13" text-anchor="middle">Choose Dataset</text>
        </g>
      </g>

      <!-- Supported Formats Badges -->
      <g transform="translate(270, 395)">
        <text x="0" y="0" fill="#94a3b8" class="font-body" font-size="12" text-anchor="middle">Supported Formats:</text>

        <rect x="-95" y="12" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="-52" y="29" fill="#38bdf8" class="font-mono" font-size="11" text-anchor="middle">📄 .CSV</text>

        <rect x="10" y="12" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
        <text x="52" y="29" fill="#10b981" class="font-mono" font-size="11" text-anchor="middle">📊 .XLSX</text>
      </g>
    </g>
  </g>
</svg>
